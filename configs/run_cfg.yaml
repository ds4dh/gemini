# --------------------------------------------------------------------------------
# GEMINI CLINICAL TEXT EXTRACTION PIPELINE - RUN CONFIGURATION
# --------------------------------------------------------------------------------

data:
  # extraction_config_path: "configs/extraction_cfgs/clinical_variables.yaml"
  # input_path: "data/synthetic_clinical_notes.csv"
  extraction_config_path: "configs/extraction_cfgs/mrs_score.yaml"
  input_path: "data/data_2024/processed/dataset.csv"
  input_text_column: "input_text"
  id_column: "patient_id"
  max_samples: null  # int, or null = all samples
  remove_samples_without_label: false

output:
  result_dir: "./results"
  use_timestamp_subfolder: true
  detailed_filename: "detailed_clinical_database.csv"
  summary_filename: "summary_clinical_database.csv"
  report_filename: "extraction_report.json"
  save_chunk_size: 100  # checkpoint frequency
  resume_previous_run: false

model:
  # model_path: "Qwen/Qwen2.5-0.5B-Instruct"
  # model_path: "Qwen/Qwen3-0.6B"
  # model_path: "Qwen/Qwen3.5-0.8B"
  # model_path: "cyankiwi/Qwen3.5-4B-AWQ-4bit"
  # model_path: "AxionML/Qwen3.5-4B-NVFP4"
  # model_path: "cyankiwi/Qwen3.6-27B-AWQ-INT4"
  model_path: "unsloth/Qwen3.8-27B-NVFP4"
  quant_scheme: null  # only used if model_path.lower() contains "gguf"
  reasoning_parser: auto  # auto | qwen3 | deepseek_r1 | granite | hunyuan | null

  # Inference configuration
  inference_backend: "vllm-serve-async"  # vllm | vllm-serve | vllm-serve-async | llama-cpp | mock
  n_inference_repeats: 10
  max_concurrent_requests: 3  # async client concurrency
  max_concurrent_inferences: 30  # vLLM --max-num-seqs

  # Memory management
  num_gpus_to_use: null
  gpu_memory_utilization: 0.90
  enforce_eager: true  # true lowers vram use, but reduces throughput
  delete_model_cache_after_run: false

  # Reasoning and output guiding
  reasoning:
    enabled: auto  # true | false | auto
    effort: auto  # auto | off | low | medium | high | xhigh
    preserve_thinking: false  # keep previous reasoning in multi-turn chats
    hard_thinking_token_budget: 768  # custom hard reasoning cap
  use_output_guide: true  # enable XGrammar-constrained final JSON
  logits_processors:
    - "src.models.logits_processors:ThinkingJSONAdapterProcessor"

  # Generation parameters
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  presence_penalty: 0.0
  repetition_penalty: 1.0
  max_new_tokens: 1024  # reasoning budget + final JSON response
  max_context_length: 5000