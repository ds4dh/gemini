# ==============================================================================
# GEMINI CLINICAL TEXT EXTRACTION PIPELINE - UNIFIED CONFIGURATION
# ==============================================================================
# Modify this single file to change what is extracted, which dataset is loaded,
# how the model behaves, and where to write the results.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. TARGET EXTRACTION SCHEMA
# ------------------------------------------------------------------------------
# Define the medical variables to extract from clinical text directly below.
# No Python code edits are needed to add or modify extraction fields!
schema:
  name: "ClinicalVariablesExtractionSchema"
  fields:
    mRS:
      type: "int"
      description: "Modified Rankin Scale score (0=No symptoms, 1=No significant disability, 2=Slight disability, 3=Moderate disability, 4=Moderately severe disability, 5=Severe disability, 6=Dead, or -1 if unknown)"
      ge: -1
      le: 6
      default: -1

    smoking_status:
      type: "enum"
      description: "Patient smoking habit classification"
      enum_values: ["Smoker", "Non-smoker", "Former-smoker", "Unknown"]
      default: "Unknown"

    aneurysm_size_mm:
      type: "float"
      description: "Maximum diameter of intracranial aneurysm in millimeters if present, else null"
      default: null

# ------------------------------------------------------------------------------
# 2. PROMPT TEMPLATES & TASK CONTEXT
# ------------------------------------------------------------------------------
prompt:
  system_template: |
    {task_description}
    {domain_knowledge}
    {output_specifications}
  
  user_template: |
    Voici le texte d'entrée:
    DEBUT DU TEXTE:
    {input_text}
    FIN DU TEXTE

  context_data:
    task_description: |
      Tu es un expert médical et neuro-chirurgien. Ta tâche est d’extraire les variables cliniques du patient 
      (mRS score, statut tabagique, taille d'anévrisme en mm) d'après le texte médical fourni.
    domain_knowledge: |
      Règles cliniques pour l'extraction:
      - mRS (Échelle de Rankin Modifiée): 0 (aucun symptôme), 1 (incapacité non significative), 2 (incapacité légère, autonome), 3 (incapacité modérée, marche seul), 4 (incapacité modérément sévère, besoin d'aide pour marcher/soins), 5 (alité/incontinent), 6 (décédé). -1 si non mentionné.
      - smoking_status: "Smoker" (fumeur actif), "Non-smoker" (jamais fumé), "Former-smoker" (ancien fumeur/sevré), "Unknown" (inconnu/non mentionné).
      - aneurysm_size_mm: Diamètre maximal de l'anévrisme intracrânien en mm (ex: 4.5), ou null si aucun anévrisme décelé.
    output_specifications: |
      Si tu inclus un raisonnement, mets-le uniquement entre les balises <think> et </think> et limite-le à 5 phrases maximum.
      La réponse finale doit être un objet JSON strict sans texte additionnel, avec le format suivant:
      {
        "mRS": <nombre entier entre 0 et 6 ou -1>,
        "smoking_status": "<Smoker | Non-smoker | Former-smoker | Unknown>",
        "aneurysm_size_mm": <nombre décimal ou null>
      }

# ------------------------------------------------------------------------------
# 3. DATASET INPUT & PREPROCESSING
# ------------------------------------------------------------------------------
data:
  input_path: "data/synthetic_clinical_notes.csv"
  input_text_column: "input_text"
  id_column: "patient_id"
  sample_small_dataset: false
  min_samples_per_class: 15
  remove_samples_without_label: false

# ------------------------------------------------------------------------------
# 4. MODEL & INFERENCE BACKEND
# ------------------------------------------------------------------------------
model:
  # Model path or HuggingFace ID
  model_path: "Qwen/Qwen2.5-0.5B-Instruct"

  # Inference backend options:
  # - "transformers" (HuggingFace Transformers PyTorch - great for local desktop testing)
  # - "mock" (Instant dummy offline testing)
  # - "vllm" (vLLM direct GPU - for Linux/HPC)
  # - "vllm-serve-async" (vLLM OpenAI server - for high-throughput Linux/HPC)
  # - "llama-cpp" (GGUF llama.cpp)
  inference_backend: "transformers"

  quant_scheme: null
  enable_thinking: false
  max_thinking_tokens: 512
  n_inference_repeats: 1

  # Generation hyperparameters
  temperature: 0.1
  top_p: 0.9
  max_new_tokens: 512
  max_context_length: 4096
  use_output_guide: false
  num_gpus_to_use: null
  gpu_memory_utilization: 0.85
  delete_model_cache_after_run: false

# ------------------------------------------------------------------------------
# 5. OUTPUT PATHS & SAVING
# ------------------------------------------------------------------------------
output:
  result_dir: "./results"
  use_timestamp_subfolder: true
  detailed_filename: "detailed_clinical_database.csv"
  summary_filename: "summary_clinical_database.csv"
  report_filename: "extraction_report.json"
  save_chunk_size: 10
  resume_previous_run: false
